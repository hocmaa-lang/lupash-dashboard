<title>Lupash — Organic Rank Tracker</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1120;
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#e9edfa}
  .box{width:min(92vw,380px);background:#151b2d;border:1px solid #283253;border-radius:18px;

  input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border-radius:10px;
    border:1px solid #333f66;background:#10182a;color:#e9edfa}
  input:focus{outline:2px solid #8ea2f0;outline-offset:1px;border-color:#8ea2f0}
  button{width:100%;margin-top:22px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;
    border:0;border-radius:10px;padding:12px;background:#3f68fe;color:#fff}
  button:hover{background:#5578ff} button:disabled{opacity:.6;cursor:progress}
  .err{color:#ec6e6c;font-size:13px;text-align:center;margin-top:14px;min-height:18px}
  .foot{margin-top:18px;text-align:center;color:#6e789b;font-size:11px}
</style></head><body>
